# Per-app config for the shared image-smoke harness (tests/image-smoke.sh, synced
# from cplieger/ci). The health gate proves Postfix answers a 220 banner on port
# 25; smoke_verify below adds what no other test in this repo proves, that the
# relay actually RELAYS, in the posture production uses: mandatory STARTTLS, a
# verified upstream certificate, and SASL LOGIN with an interior-space password.
#
# Shape. A sink container built from THIS SAME image plays the upstream provider:
# it accepts mail for example.test and hands it to Postfix's discard transport,
# and it DEMANDS both TLS and AUTH (smtpd_tls_security_level=encrypt,
# smtpd_relay_restrictions=permit_sasl_authenticated). So a message the app
# reports as sent is itself the proof that the app's TLS client, its CA
# verification, its cyrus-sasl client plugins and its lmdb sasl_passwd map all
# work, and no assertion has to name a log field for those. Nothing third-party
# is pulled: postfix, saslpasswd2 and the cyrus sasldb auxprop plugin all ship in
# the image. The runner needs openssl (present on the CI runner) for the
# throwaway certificate; committing one instead would ship a private key and an
# expiry date.
#
# Submission goes through the app's own port 25 with the image's BusyBox sendmail
# applet, not Postfix's sendmail: the applet speaks real SMTP, so the inbound
# smtpd path (mynetworks, restrictions, cleanup) is exercised too, and the
# rendered mynetworks includes 127.0.0.0/8 so a loopback client is accepted.
#
# Not covered, deliberately: both ends are the same Postfix build, so a
# regression that changes client and server symmetrically stays invisible. A
# stock third-party sink image would close that gap, at the cost of an image tag
# inside a .conf that neither Renovate nor the Dockerfile gates track, so the
# shared-build sink is the trade taken here.
#
# The log lines the shipped Loki rules select are pinned to this Postfix build:
# a recipient the sink refuses must log the bounce SmtpRelayMailBounced counts,
# and the deferred control must log the deferral and the delay= field
# SmtpRelayMailStuck reads, each matched with the selectors read from
# alerts/logql.yaml.
#
# The app runs with METRICS_PORT set, published on a loopback port: a scrape
# from the runner must parse with promtool, from the image the Dockerfile's
# promtool stage pins, and the deferred control must show in the queue gauges.
# It runs with no-new-privileges, as docs/hardening.md recommends, because that
# is the profile in which the responder can read the queue only through the
# access entry the entrypoint grants.
#
# A second control boots a throwaway container with master(8) hidden and asserts
# the boot ENDS, non-zero, naming the failed Postfix check. Postfix is PID 1 by
# exec, so a Postfix that cannot start has no wrapper left to report success for
# it; this is what pins that shape, so a Postfix or base bump that breaks the
# binary surfaces as a restart loop and never as a green idle container.
SMOKE_APP_NAME=smtp-relay
SMOKE_TIMEOUT=90
SMOKE_LICENSE_TREE=1

# $$ is the harness's pid, the same disambiguator its own container name uses,
# so parallel runs on one host never share a network, a sink or a fixture.
SMOKE_NET="smoke-smtp-relay-net-$$"
SMOKE_SINK="smoke-smtp-relay-sink-$$"
SMOKE_BOOT="smoke-smtp-relay-boot-$$"
SMOKE_FIXTURE=$(mktemp -d)
SMOKE_RCPT_OK=smoke-sent@example.test
SMOKE_RCPT_CONTROL=smoke-control@example.test
# The sink refuses this one recipient with a 5xx, so the app logs a bounce.
SMOKE_RCPT_BOUNCE=smoke-bounce@example.test
SMOKE_LOGQL="$SMOKE_DIR/../alerts/logql.yaml"
SMOKE_METRICS_PORT=9154
# Interior whitespace is the Gmail App Password shape (issue #392). Here it rides
# through the lmdb map into a real AUTH exchange, which the build-time postmap
# assertion cannot do. It reaches the container through --env-file because
# SMOKE_RUN_ARGS is word-split and cannot carry a value with spaces.
SMOKE_PASSWORD='aaaa bbbb cccc dddd'

# Release everything acquired below. The harness's EXIT trap calls this after it
# removes the app container; the trap armed further down covers this file's own
# window, before that one exists, and smoke_die calls it directly.
# shellcheck disable=SC2329  # invoked indirectly via an EXIT trap
smoke_cleanup() {
  docker rm -f "$SMOKE_SINK" "$SMOKE_BOOT" >/dev/null 2>&1 || true
  docker network rm "$SMOKE_NET" >/dev/null 2>&1 || true
  rm -rf "$SMOKE_FIXTURE"
}

smoke_die() {
  printf 'FAIL: %s\n' "$1" >&2
  smoke_cleanup
  exit 1
}

# Everything below this line acquires host state, and the harness arms its own
# traps only AFTER sourcing this file -- so the window from here to the end of the
# file, which contains the up-to-30s sink wait, is this file's to cover. Same two
# handlers the harness uses, for the same reason: an EXIT trap runs on SIGINT but
# not on SIGTERM or SIGHUP, so those convert to a normal exit. The harness replaces
# both a few lines later, and its cleanup calls smoke_cleanup as well.
trap 'exit 143' TERM HUP
trap smoke_cleanup EXIT

# The sink's boot script is a file rather than an `sh -c` string so it stays
# readable and quoting-safe; it is bind-mounted into the sink from the fixture
# dir. Emitted from its own function because a heredoc left pending at an `if`
# has no stable shfmt spelling.
smoke_emit_sink_boot() {
  cat <<'SINK_BOOT'
#!/bin/sh
# Fake upstream provider for the image smoke test, from the app's own image:
# accepts mail for example.test over MANDATORY STARTTLS with MANDATORY SASL AUTH
# and delivers it to the discard transport, so no mailbox or alias db is needed.
# It refuses one recipient with a 554, the permanent failure a provider gives.
set -eu
sink_host=$1
sink_pass=$2
sink_bounce=$3
# Alpine's cyrus-sasl is compiled with its config and sasldb under /etc/sasl2; a
# sasldb_path in smtpd.conf is ignored (measured), so the db goes to that path.
mkdir -p /etc/sasl2
printf 'pwcheck_method: auxprop\nauxprop_plugin: sasldb\nmech_list: PLAIN LOGIN\n' >/etc/sasl2/smtpd.conf
printf '%s' "$sink_pass" | saslpasswd2 -p -c -f /etc/sasl2/sasldb2 -u "$sink_host" smokeuser
chmod 644 /etc/sasl2/sasldb2
# smtpd looks up local_recipient_maps through the alias db even with no local
# delivery, and logs an error for every connection without it.
newaliases
postconf -e "myhostname=$sink_host" \
  'mydestination=' \
  'relay_domains=example.test' \
  'relay_transport=discard' \
  'smtpd_tls_security_level=encrypt' \
  'smtpd_tls_cert_file=/fixture/sink.crt' \
  'smtpd_tls_key_file=/fixture/sink.key' \
  'smtpd_sasl_auth_enable=yes' \
  'smtpd_sasl_type=cyrus' \
  'smtpd_sasl_path=smtpd' \
  "smtpd_sasl_local_domain=$sink_host" \
  'smtpd_sasl_security_options=noanonymous' \
  'smtpd_tls_auth_only=yes' \
  'smtpd_relay_restrictions=permit_sasl_authenticated, reject' \
  "smtpd_recipient_restrictions=check_recipient_access inline:{$sink_bounce=REJECT}" \
  'maillog_file=/dev/stdout'
postfix set-permissions >/dev/null
exec postfix start-fg
SINK_BOOT
}

smoke_emit_sink_boot >"$SMOKE_FIXTURE/sink-boot.sh" \
  || smoke_die "could not write the sink boot script"
# RELAY_HOST is the sink's container name, so it must also be the certificate's
# SAN: at the app's default level (secure) Postfix verifies the chain AND the
# hostname, and docker's embedded DNS resolves the name on the private network.
# An EC key is ~0.3s where RSA-2048 measured ~10s on a slow host. CA:TRUE comes
# from openssl req -x509, so the cert is usable as its own trust anchor.
openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 2 \
  -keyout "$SMOKE_FIXTURE/sink.key" -out "$SMOKE_FIXTURE/sink.crt" \
  -subj "/CN=$SMOKE_SINK" -addext "subjectAltName=DNS:$SMOKE_SINK" >/dev/null 2>&1 \
  || smoke_die "openssl could not mint the sink certificate (is openssl installed?)"
# The app's CA bundle is the image's OWN bundle plus the sink's certificate, so
# replacing the file does not hide a missing or emptied ca-certificates package.
# main.cf hardcodes smtp_tls_CAfile, so this path is the only lever.
docker run --rm --entrypoint cat "$IMG" /etc/ssl/certs/ca-certificates.crt \
  >"$SMOKE_FIXTURE/ca.crt" || smoke_die "could not read the image's CA bundle"
smoke_ca_count=$(grep -c 'BEGIN CERTIFICATE' "$SMOKE_FIXTURE/ca.crt" || true)
[ "$smoke_ca_count" -ge 20 ] \
  || smoke_die "the image's CA bundle holds only $smoke_ca_count certificates (ca-certificates missing?)"
cat "$SMOKE_FIXTURE/sink.crt" >>"$SMOKE_FIXTURE/ca.crt" \
  || smoke_die "could not append the sink certificate to the CA bundle"
# SMTP_TLS_SECURITY_LEVEL is deliberately NOT set: the app's own default is
# secure, and that is the posture to prove.
{
  printf 'RELAY_HOST=%s\n' "$SMOKE_SINK"
  printf 'RELAY_PORT=25\n'
  printf 'RELAY_LOGIN=smokeuser\n'
  printf 'RELAY_PASSWORD=%s\n' "$SMOKE_PASSWORD"
} >"$SMOKE_FIXTURE/env" || smoke_die "could not write the app env file"
# mktemp makes the directory 0700 for the runner's user; the sink's smtpd reads
# the cert and key as the postfix user.
chmod 755 "$SMOKE_FIXTURE" || smoke_die "could not open the fixture directory"
chmod 644 "$SMOKE_FIXTURE"/* || smoke_die "could not make the fixture files readable"

docker network create "$SMOKE_NET" >/dev/null \
  || smoke_die "could not create the smoke network $SMOKE_NET"
docker run -d --name "$SMOKE_SINK" --network "$SMOKE_NET" \
  -v "$SMOKE_FIXTURE:/fixture:ro" --entrypoint /bin/sh "$IMG" \
  /fixture/sink-boot.sh "$SMOKE_SINK" "$SMOKE_PASSWORD" "$SMOKE_RCPT_BOUNCE" >/dev/null \
  || smoke_die "could not start the sink container"

# Wait for the sink's own master to report ready before the app boots, so the
# app's startup probe sees a reachable upstream and the first delivery is not
# racing the sink.
smoke_i=0
while [ "$smoke_i" -lt 30 ]; do
  if docker logs "$SMOKE_SINK" 2>&1 | grep -qF 'daemon started'; then
    break
  fi
  smoke_i=$((smoke_i + 1))
  sleep 1
done
[ "$smoke_i" -lt 30 ] || smoke_die "the sink never logged 'daemon started'"

SMOKE_PROMTOOL_IMAGE=$(sed -n 's/^FROM \(.*\) AS promtool$/\1/p' "$SMOKE_DIR/../Dockerfile")
[ -n "$SMOKE_PROMTOOL_IMAGE" ] || smoke_die "the Dockerfile names no promtool stage"

SMOKE_RUN_ARGS="--security-opt no-new-privileges:true --network $SMOKE_NET --env-file ${SMOKE_FIXTURE}/env -v ${SMOKE_FIXTURE}/ca.crt:/etc/ssl/certs/ca-certificates.crt:ro -e METRICS_PORT=$SMOKE_METRICS_PORT -p 127.0.0.1::$SMOKE_METRICS_PORT"

# Poll a container log for a fixed string: the json-file driver can lag the
# writer, so a single grep can miss a line the container already wrote.
smoke_wait_for_log() {
  smoke_i=0
  while [ "$smoke_i" -lt 30 ]; do
    if docker logs "$1" 2>&1 | grep -qF -- "$2"; then
      return 0
    fi
    smoke_i=$((smoke_i + 1))
    sleep 1
  done
  printf 'FAIL: %s\n' "$3" >&2
  return 1
}

# One message, submitted over the app's own port 25.
smoke_submit() {
  docker exec "$SMOKE_CONTAINER" sh -c \
    "printf 'Subject: image smoke\r\n\r\nprobe\r\n' | busybox sendmail -f smoke@example.invalid -S 127.0.0.1:25 $1"
}

smoke_sent_line() {
  docker logs "$SMOKE_CONTAINER" 2>&1 | grep -F "to=<$1>" | grep -q 'status=sent'
}

# smoke_rule_filter ALERT -- the |= line filter of ALERT's rule in alerts/logql.yaml.
# The delivery lines below are matched with the rule's own text, so a rule edit
# that no longer matches what the pinned Postfix logs fails here.
smoke_rule_filter() {
  awk -v a="$1" '$0 ~ ("alert: " a "$") { f = 1 } f && /[|]= "/ { sub(/.*[|]= "/, ""); sub(/".*/, ""); print; exit }' "$SMOKE_LOGQL"
}

# smoke_rule_regexp ALERT -- the rule's LogQL regexp stage as an ERE: a named
# group becomes a plain one.
smoke_rule_regexp() {
  awk -v a="$1" '$0 ~ ("alert: " a "$") { f = 1 } f && /[|] regexp "/ { sub(/.*[|] regexp "/, ""); sub(/".*/, ""); gsub(/[(][?]P<[a-z_]+>/, "("); print; exit }' "$SMOKE_LOGQL"
}

# smoke_delivery_lines RCPT -- the app's delivery lines for one recipient.
smoke_delivery_lines() {
  docker logs "$SMOKE_CONTAINER" 2>&1 | grep -F "to=<$1>"
}

# smoke_scrape PATH -- one HTTP GET of the metrics port from the runner; the
# reply lands in $SMOKE_FIXTURE/reply and its body in $SMOKE_FIXTURE/body.
smoke_scrape() {
  smoke_addr=$(docker port "$SMOKE_CONTAINER" "$SMOKE_METRICS_PORT/tcp" | head -n 1)
  [ -n "$smoke_addr" ] || {
    printf 'FAIL: METRICS_PORT %s is not published\n' "$SMOKE_METRICS_PORT" >&2
    return 1
  }
  curl -sS -i --max-time 15 "http://$smoke_addr$1" >"$SMOKE_FIXTURE/reply" || {
    printf 'FAIL: no reply from the metrics port at %s\n' "$smoke_addr" >&2
    return 1
  }
  sed '1,/^\r$/d' "$SMOKE_FIXTURE/reply" >"$SMOKE_FIXTURE/body"
}

smoke_metric() {
  awk -v s="$1" '$1 == s { print $2 }' "$SMOKE_FIXTURE/body"
}

smoke_verify() {
  smoke_scrape /metrics || return 1
  case "$(head -n 1 "$SMOKE_FIXTURE/reply")" in
    'HTTP/1.1 200 OK'*) ;;
    *)
      printf 'FAIL: a /metrics scrape did not answer 200\n' >&2
      cat "$SMOKE_FIXTURE/reply" >&2
      return 1
      ;;
  esac
  if ! grep -q '^Content-Type: text/plain; version=0.0.4' "$SMOKE_FIXTURE/reply"; then
    printf 'FAIL: the scrape is not typed as text format 0.0.4\n' >&2
    cat "$SMOKE_FIXTURE/reply" >&2
    return 1
  fi
  if ! smoke_parse=$(docker run --rm -i --network none --entrypoint /bin/promtool "$SMOKE_PROMTOOL_IMAGE" \
    check metrics <"$SMOKE_FIXTURE/body" 2>&1); then
    printf 'FAIL: promtool rejected the scrape:\n%s\n' "$smoke_parse" >&2
    cat "$SMOKE_FIXTURE/body" >&2
    return 1
  fi
  if [ "$(smoke_metric smtp_relay_queue_scrape_ok)" != 1 ]; then
    printf 'FAIL: the responder could not read the queue as its spawn(8) user\n' >&2
    cat "$SMOKE_FIXTURE/body" >&2
    docker logs "$SMOKE_CONTAINER" 2>&1 | grep -F 'METRICS_PORT responder' >&2 || :
    return 1
  fi
  if ! grep -q '^smtp_relay_build_info{version="[^"]*",postfix_version="[0-9.]*"} 1$' "$SMOKE_FIXTURE/body"; then
    printf 'FAIL: the scrape carries no build_info with a Postfix version\n' >&2
    cat "$SMOKE_FIXTURE/body" >&2
    return 1
  fi
  smoke_scrape /healthz || return 1
  case "$(head -n 1 "$SMOKE_FIXTURE/reply")" in
    'HTTP/1.1 404 '*) ;;
    *)
      printf 'FAIL: the metrics port answered /healthz, which it does not serve\n' >&2
      cat "$SMOKE_FIXTURE/reply" >&2
      return 1
      ;;
  esac

  smoke_stuck_filter=$(smoke_rule_filter SmtpRelayMailStuck)
  smoke_stuck_regexp=$(smoke_rule_regexp SmtpRelayMailStuck)
  smoke_bounced_filter=$(smoke_rule_filter SmtpRelayMailBounced)
  if [ -z "$smoke_stuck_filter" ] || [ -z "$smoke_stuck_regexp" ] || [ -z "$smoke_bounced_filter" ]; then
    printf 'FAIL: could not read the SmtpRelayMailStuck and SmtpRelayMailBounced selectors from %s\n' "$SMOKE_LOGQL" >&2
    return 1
  fi
  if ! smoke_submit "$SMOKE_RCPT_OK"; then
    printf 'FAIL: the app refused a message submitted on its own port 25\n' >&2
    return 1
  fi
  # The sink demands STARTTLS and AUTH, so "sent" cannot be reached without a
  # verified TLS session and a successful SASL exchange through the lmdb map.
  smoke_wait_for_log "$SMOKE_CONTAINER" "to=<$SMOKE_RCPT_OK>" \
    "the app never logged a delivery attempt for $SMOKE_RCPT_OK" || return 1
  if ! smoke_sent_line "$SMOKE_RCPT_OK"; then
    printf 'FAIL: the message was not relayed; the app logged this delivery instead\n' >&2
    docker logs "$SMOKE_CONTAINER" 2>&1 | grep -F "to=<$SMOKE_RCPT_OK>" >&2
    return 1
  fi
  # Independent surface: the upstream's own record that it received the message
  # AND that the app authenticated for it.
  smoke_wait_for_log "$SMOKE_SINK" "sasl_username=smokeuser@$SMOKE_SINK" \
    "the sink never recorded an authenticated client; the app relayed without AUTH?" || return 1
  smoke_queue=$(docker exec "$SMOKE_CONTAINER" postqueue -p 2>&1)
  case "$smoke_queue" in
    *'Mail queue is empty'*) ;;
    *)
      printf 'FAIL: mail is still queued after a delivery the app reported as sent\n' >&2
      printf '%s\n' "$smoke_queue" >&2
      return 1
      ;;
  esac

  # A recipient the sink refuses with a 554 must log as a bounce in the shape the
  # SmtpRelayMailBounced rule selects.
  if ! smoke_submit "$SMOKE_RCPT_BOUNCE"; then
    printf 'FAIL: the app refused the message for the bounce recipient\n' >&2
    return 1
  fi
  smoke_wait_for_log "$SMOKE_CONTAINER" "to=<$SMOKE_RCPT_BOUNCE>" \
    "the app never logged a delivery attempt for $SMOKE_RCPT_BOUNCE" || return 1
  smoke_lines=$(smoke_delivery_lines "$SMOKE_RCPT_BOUNCE")
  case "$smoke_lines" in
    *"$smoke_bounced_filter"*) ;;
    *)
      printf 'FAIL: a recipient refused with a 554 did not log "%s"; the app logged this instead\n' "$smoke_bounced_filter" >&2
      printf '%s\n' "$smoke_lines" >&2
      return 1
      ;;
  esac

  # Boot control, in a throwaway container so the relay above stays intact. With
  # master(8) hidden the entrypoint's `postfix check` fails and PID 1 must exit
  # non-zero naming that check; the shell wrapper exits 99 if the hide itself
  # fails, so a moved path reads as a broken premise and never as a pass. The
  # outer timeout is the bound for the failure this control exists to catch: a
  # broken Postfix left idling behind a live entrypoint. -k is what makes it a
  # bound: docker run proxies the TERM to PID 1 and waits, and a PID 1 with no
  # TERM handler ignores it, so only the KILL escalation ends the wait.
  smoke_boot_rc=0
  smoke_boot_out=$(timeout -k 5 60 docker run --name "$SMOKE_BOOT" --network none \
    --env-file "$SMOKE_FIXTURE/env" -e STARTUP_PROBE=false --entrypoint /bin/sh "$IMG" -c \
    'mv /usr/libexec/postfix/master /tmp/smoke-hidden-master || exit 99; exec /usr/local/bin/entrypoint.sh' 2>&1) \
    || smoke_boot_rc=$?
  docker rm -f "$SMOKE_BOOT" >/dev/null 2>&1 || true
  case "$smoke_boot_rc" in
    0)
      printf 'FAIL: a boot with master(8) hidden exited 0\n' >&2
      printf '%s\n' "$smoke_boot_out" >&2
      return 1
      ;;
    99)
      printf 'FAIL: could not hide /usr/libexec/postfix/master; the control premise moved and the path needs re-pointing\n' >&2
      return 1
      ;;
    124 | 137 | 143)
      printf 'FAIL: a boot with master(8) hidden was still running after 60s instead of exiting\n' >&2
      printf '%s\n' "$smoke_boot_out" >&2
      return 1
      ;;
  esac
  if ! printf '%s\n' "$smoke_boot_out" | grep -qF 'postfix config check failed'; then
    printf 'FAIL: the boot with master(8) hidden exited %s without logging the failed postfix check\n' "$smoke_boot_rc" >&2
    printf '%s\n' "$smoke_boot_out" >&2
    return 1
  fi

  # Negative control, last because it leaves the image broken. The cyrus-sasl
  # PLAIN/LOGIN plugins come from an UNPINNED apk package, so this is the shape
  # an upstream package bump takes here: the payload loses a runtime dependency,
  # the 220 banner keeps answering, health stays green, and every message
  # silently defers. Without the assertions above, that ships.
  if ! docker exec "$SMOKE_CONTAINER" sh -c \
    'mkdir -p /tmp/smoke-hidden && mv /usr/lib/sasl2/libplain.so* /usr/lib/sasl2/liblogin.so* /tmp/smoke-hidden/'; then
    printf 'FAIL: could not hide the cyrus-sasl PLAIN/LOGIN plugins; the control premise moved and the paths need re-pointing\n' >&2
    return 1
  fi
  # An idle smtp(8) child serves the next message from memory, so without a
  # reload the control passes on a delivery agent that started before the break
  # (measured: status=sent appeared twice with the agent's binary already gone).
  if ! docker exec "$SMOKE_CONTAINER" postfix reload >/dev/null 2>&1; then
    printf 'FAIL: postfix reload failed, so the control cannot force a fresh delivery agent\n' >&2
    return 1
  fi
  if ! smoke_submit "$SMOKE_RCPT_CONTROL"; then
    printf 'FAIL: the app refused the control message\n' >&2
    return 1
  fi
  smoke_wait_for_log "$SMOKE_CONTAINER" "to=<$SMOKE_RCPT_CONTROL>" \
    "the app never logged a delivery attempt for the control message" || return 1
  # Single shot, not polled: the wait above proved the log is flushed past this
  # message's delivery attempt, so an absence here is a real absence.
  if smoke_sent_line "$SMOKE_RCPT_CONTROL"; then
    printf 'FAIL: a relay whose SASL plugins are gone still reported the message as sent\n' >&2
    return 1
  fi
  # The deferral must carry the filter and the delay= field SmtpRelayMailStuck
  # reads, on the same line.
  smoke_lines=$(smoke_delivery_lines "$SMOKE_RCPT_CONTROL" | grep -F -- "$smoke_stuck_filter" | grep -E -- "$smoke_stuck_regexp" || true)
  if [ -z "$smoke_lines" ]; then
    printf 'FAIL: the deferred control message logged no line with "%s" and a field matching %s\n' "$smoke_stuck_filter" "$smoke_stuck_regexp" >&2
    smoke_delivery_lines "$SMOKE_RCPT_CONTROL" >&2
    return 1
  fi
  smoke_queue=$(docker exec "$SMOKE_CONTAINER" postqueue -p 2>&1)
  case "$smoke_queue" in
    *"$SMOKE_RCPT_CONTROL"*) ;;
    *)
      printf 'FAIL: the control message is neither sent nor queued; where did it go?\n' >&2
      printf '%s\n' "$smoke_queue" >&2
      return 1
      ;;
  esac
  # The deferred control must reach the gauges the PromQL SmtpRelayMailStuck
  # reads; arrival_time has a one-second resolution, hence the poll.
  smoke_i=0
  while [ "$smoke_i" -lt 30 ]; do
    smoke_scrape /metrics || return 1
    smoke_deferred=$(smoke_metric 'smtp_relay_queue_messages{queue="deferred"}')
    smoke_age=$(smoke_metric 'smtp_relay_queue_oldest_message_age_seconds{queue="deferred"}')
    if [ "${smoke_deferred:-0}" -ge 1 ] && [ "${smoke_age:-0}" -gt 0 ]; then
      break
    fi
    smoke_i=$((smoke_i + 1))
    sleep 1
  done
  if [ "$smoke_i" -ge 30 ]; then
    printf 'FAIL: the deferred control never showed as a deferred message with a positive age\n' >&2
    cat "$SMOKE_FIXTURE/body" >&2
    return 1
  fi

  # Every assertion above is silent on success, so name what was proved: a run
  # that relayed the message and one whose hook returned early otherwise print
  # the same thing, leaving the harness's elapsed time unaccountable.
  printf 'smtp-relay payload: postfix accepted a message on the listener, relayed it rather than merely queueing it, drained the queue, logged "%s" for a recipient the upstream refused, served a promtool-clean scrape on METRICS_PORT that counted %s deferred message(s) aged %ss, a boot with master(8) hidden exited %s naming the failed postfix check, and the SASL-less control logged "%s" with its delay field instead of sent\n' "$smoke_bounced_filter" "$smoke_deferred" "$smoke_age" "$smoke_boot_rc" "$smoke_stuck_filter"
}
